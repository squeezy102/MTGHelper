<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>MTG Helper</title>
    <link rel="stylesheet" href="styles/main.css">
  </head>
  <body>
    <div class="app-container">
      <div class="main-content">

        <div class="left-panel">
          <div class="app-header" id="appHeader"></div>
          <div class="chat-history" id="chatHistory"></div>
          <div class="chat-input-bar">
            <input type="text" id="chatInput" placeholder="Ask anything..." />
            <button id="sendButton">Send</button>
          </div>
        </div>

        <div class="divider"></div>

        <div class="right-panel">
          <div class="card-tabs-bar" id="cardTabsBar">
            <div class="card-tabs-empty">No cards loaded</div>
          </div>
          <div class="card-image-section" id="cardImageSection">
            <div class="card-image-missing">Cards mentioned in the conversation will appear here.</div>
          </div>
          <div class="card-info-section" id="cardInfoSection"></div>
          <div class="card-meta-section" id="cardMetaSection"></div>
        </div>

      </div>
    </div>
  </body>
  <script src="../dist/renderer.bundle.js"></script>
</html>
